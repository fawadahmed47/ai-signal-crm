name: signal-crm

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-signal_crm}
      POSTGRES_USER: ${POSTGRES_USER:-signal_crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-signal_crm}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  migrate:
    image: postgres:17-alpine
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-signal_crm}
      PGUSER: ${POSTGRES_USER:-signal_crm}
      PGPASSWORD: ${POSTGRES_PASSWORD:-signal_crm}
    volumes:
      - ./database/migrations:/migrations:ro
      - ./infrastructure/docker/migrate.sh:/usr/local/bin/migrate:ro
    entrypoint: ["sh", "/usr/local/bin/migrate"]

volumes:
  postgres-data:
