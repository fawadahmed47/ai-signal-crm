name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_DATABASE_URL: postgresql://signal_crm:signal_crm@localhost:5432/signal_crm

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v1
        with:
          version: 11.19.0
          runtime: node@24.19.0
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start PostgreSQL
        run: docker compose up --detach postgres

      - name: Apply database migrations
        run: docker compose --profile tools run --rm migrate

      - name: Type-check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build production application
        run: pnpm build

      - name: Show PostgreSQL logs after failure
        if: failure()
        run: docker compose logs postgres

      - name: Stop test services
        if: always()
        run: docker compose down --volumes

  ingestion:
    name: Ingestion and PostgreSQL quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_DATABASE_URL: postgresql://signal_crm:signal_crm@localhost:5432/signal_crm

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ingestion/requirements.txt

      - name: Install ingestion dependencies
        run: python -m pip install --requirement services/ingestion/requirements.txt

      - name: Start PostgreSQL
        run: docker compose up --detach postgres

      - name: Apply database migrations
        run: docker compose --profile tools run --rm migrate

      - name: Verify idempotent migrations
        run: docker compose --profile tools run --rm migrate

      - name: Run ingestion tests
        run: python -m unittest discover -s services/ingestion/tests -v

      - name: Show PostgreSQL logs after failure
        if: failure()
        run: docker compose logs postgres

      - name: Stop test services
        if: always()
        run: docker compose down --volumes
